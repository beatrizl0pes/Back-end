<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekIA - Especialista Nerd</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Devonshire&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <img src="logo.jpg" width="200" alt="GeekIA Logo">

        <h2>Especialista em animes, mangás e livros</h2>

        <p>Responda e descubra o que combina com você.</p>

        <form action="processa.php" method="POST">

            <div class="form-group">
                <label>O que você prefere?</label>

                <select name="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="Anime">Anime</option>
                    <option value="Mangá">Mangá</option>
                    <option value="Livro">Livro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qual gênero você prefere?</label>

                <select name="genero" required>
                    <option value="">Selecione...</option>
                    <option value="Ação">Ação</option>
                    <option value="Romance">Romance</option>
                    <option value="Fantasia">Fantasia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Como gosta das histórias?</label>

                <select name="tamanho" required>
                    <option value="">Selecione...</option>
                    <option value="Curtas">Curtas e rápidas</option>
                    <option value="Longas">Longas e envolventes</option>
                </select>
            </div>

            <button type="submit">Recomendar 🚀</button>

        </form>

    </div>
</body>
</html>
