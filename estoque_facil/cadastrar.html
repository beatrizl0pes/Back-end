<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil | Loja Gamer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Estoque Fácil</h1>
        <p class="subtitulo">Sistema de gerenciamento de produtos gamer</p>

        <div class="formulario">

            <h2>Cadastro de Produtos</h2>

            <form action="cadastrar.php" method="POST">

                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Ex.: Teclado mecânico" required>

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Periféricos">Periféricos</option>
                    <option value="Componentes">Componentes</option>
                    <option value="Monitores">Monitores</option>
                    <option value="Acessórios">Acessórios</option>
                </select>

                <label for="preco">Preço de venda (R$):</label>
                <input type="number" id="preco" name="preco"
                       min="0.01" step="0.01" placeholder="Ex.: 249.90" required>

                <label for="quantidade">Quantidade em estoque:</label>
                <input type="number" id="quantidade" name="quantidade"
                       min="0" placeholder="Ex.: 10" required>

                <button type="submit">Cadastrar produto</button>

            </form>

        </div>

        <p class="rodape">Estoque Fácil © 2026 | Loja Gamer</p>

    </div>

</body>
</html>
